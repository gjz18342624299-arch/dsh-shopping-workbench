function calendarCategories(row){
 const raw=String(row.category||'');
 const text=raw+' '+String(row.title||'');
 const found=shoppingCategoryRules.filter(r=>r[1].test(text)).map(r=>r[0]);
 if(found.length)return found;
 return [/多品类|红包|预售|双11商品|大促商品|参与的商品|活动SKU|会员商品|直播|符合条件|补差|活动商品/.test(text)?'通用活动':'待分类'];
}
function calendarCategoryMatch(row,category){return category==='全部'||calendarCategories(row).includes(category)}
function calendarOfferLabel(event){
 if(event.personal)return '建议购买日';
 const offer=String(event.offer||'');const reductions=offer.match(/(?:每满|满)\s*\d+(?:元)?\s*减\s*\d+(?:元)?/g);if(reductions?.length)return reductions.slice(0,2).join('／').replace(/\s/g,'');
 if(/组合购/.test(offer)&&/7折/.test(offer))return '组合购 · 折上7折';
 const discount=offer.match(/低至\s*\d+(?:\.\d+)?折/);if(discount)return discount[0];
 if(/活动商品5折|商品5折/.test(offer))return '活动商品5折';
 const coupon=offer.match(/\d+(?:元)?券/);if(coupon)return coupon[0];
 if(/随机红包|淘金币/.test(offer))return '随机红包／淘金币';
 if(/最高100元/.test(offer))return '助力红包 · 最高100元';
 if(/26888/.test(offer))return '红包加码 · 金额随机';
 if(/以旧换新低至0元/.test(offer))return '换新低至0元 · 有条件';
 if(/一件|单件|直降/.test(offer+' '+event.title))return '一件直降';
 if(/官方立减|立减/.test(offer))return '官方立减';
 if(/定金/.test(event.title))return '预售定金支付';
 if(/尾款/.test(event.title))return '预售尾款支付';
 if(/预售启动/.test(event.title))return '预售开启';
 if(/正式售卖/.test(event.title))return '现货开售／会员券';
 if(/翻卡|消费券/.test(offer))return '消费券 · 面额看券面';
 if(/差额|补差/.test(offer))return '降价可申请补差';
 if(/兴趣日|品类加补/.test(offer))return '品类加补';
 const title=String(event.title||'');
 if(/秒杀/.test(title))return '限时秒杀';
 if(/会员/.test(title))return '会员专属优惠';
 if(/服务/.test(title)&&/补贴/.test(offer))return '服务补贴';
 if(/直播/.test(title))return '直播专场';
 if(/特价/.test(title))return '限时特价';

 if(/未公布|未取得|未识别|待|尚未/.test(offer))return /节|日|专场|公告/.test(title)?'品牌／品类专场':'活动预告';
 return offer.length>24?offer.slice(0,23)+'…':offer;
}

function personalCalendarRows(data,list){const active=list.filter(i=>!i.done&&!i.plan&&i.analysis?.recommendation);return active.flatMap(item=>{const d=getDecision(item,item.analysis.recommendation);return d&&/^20\d{2}-\d{2}-\d{2}$/.test(d.date||'')?[{id:'need-'+item.id,itemId:item.id,platform:d.platform||'待选择',title:'建议买：'+item.name,category:item.analysis.category,startDate:d.date,endDate:d.date,time:d.time||'',offer:d.offer||'按推荐方案购买',claim:(d.claim||[])[0]||'打开购买方案查看领券方式',status:'active',personal:true}]:[];});}

// 领券步骤：把可复制的口令和对应的领券链接放在步骤里，而不是分开列。
const tierRe=/满\s*\d+\s*(?:元)?\s*减\s*\d+/g;
function stepExtras(step,coupons,used){
 let html='';
 if(/搜索?|口令|搜“|搜"/.test(step))for(const m of step.matchAll(/[“"]([^”"]{2,24})[”"]/g)){const code=m[1];if(/旗舰店|会场|频道|直播间/.test(code))continue;html+='<button type="button" class="copy-code" data-copy="'+esc(code)+'">复制“'+esc(code)+'”</button>'}
 const stepTiers=new Set((step.match(tierRe)||[]).map(t=>t.replace(/\s|元/g,'')));
 for(const c of coupons){if(used.has(c))continue;if(!c.url)continue;const cTiers=(String(c.offer).match(tierRe)||[]).map(t=>t.replace(/\s|元/g,''));const keys=String(c.category||'').split(/[／/、，,]/).map(k=>k.trim()).filter(k=>k.length>=2&&!/通用|活动/.test(k));const hit=cTiers.some(t=>stepTiers.has(t))||keys.some(k=>step.includes(k))||(/88VIP|消费券/.test(step)&&/88VIP/.test(c.offer))||(/品类券|加补/.test(step)&&/加补|品类/.test(c.category+c.offer));if(hit){used.add(c);html+=' '+sourceLink(c.url,'去领券：'+String(c.offer).slice(0,24)+(c.linkKind==='redirect'?'（值得买跳转）':'')+' ↗')}}

}
async function openPurchaseAdvice(id,selectedPlatform=null){const item=items.find(i=>i.id===id),r=item?.analysis?.recommendation,d=getDecision(item,r);if(!d)return;

 +'</div>');

// 我的购物安排：按“日期 + 平台”分组，同组多件提示合并一单；可导出到手机日历。
function tiersFor(platform,group){const norm=t=>t.replace(/\s|元/g,'');const own=new Set();for(const i of group){const d=getDecision(i,i.analysis?.recommendation)||{};const row=(d.platforms||[]).find(p=>sameShoppingPlatform(p.platform,platform));for(const text of [d.offer,row?.offer,d.basket])for(const t of String(text||'').match(tierRe)||[])own.add(norm(t))}const set=new Set(own);if(set.size<2)for(const c of quickCalendarData?.couponEntries||[])if(sameShoppingPlatform(c.platform,platform)&&group.some(i=>needMatches(i,c)))for(const t of String(c.offer).match(tierRe)||[])set.add(norm(t));return [...set].sort((a,b)=>Number(a.match(/\d+/)[0])-Number(b.match(/\d+/)[0])).slice(0,5)}
function scheduleHtml(pending){
 const reviews=pending.filter(i=>i.realReview);
 const groups=new Map();for(const i of reviews.sort((a,b)=>(a.realReview.date+a.realReview.time).localeCompare(b.realReview.date+b.realReview.time))){const key=i.realReview.date+'|'+i.realReview.time+'|'+i.realReview.platform;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(i)}

 if(groups.size){html+='<div class="schedule real-review-schedule">'+[...groups.entries()].map(([key,group])=>{const rv=group[0].realReview,label=dayLabel(rv.date),tiers=group.length>1?tiersFor(rv.platform,group):[];return '<div class="schedule-group'+(label==='今天'?' schedule-today':'')+'"><b class="schedule-head">'+(label?'<span class="schedule-badge">'+label+'</span>':'')+esc(cnDate(rv.date))+(rv.time?' '+esc(rv.time):'')+' · '+esc(rv.platform)+(group.length>1?' · '+group.length+' 件':'')+'</b>'+group.map(i=>{const d=getDecision(i,i.analysis?.recommendation)||{};return '<div class="schedule-entry"><p>'+esc(i.name)+(sameShoppingPlatform(i.realReview.platform,d.platform)&&d.offer?'<br><small>'+esc(d.offer)+'</small>':'')+'</p><button data-advice="'+i.id+'">查看方案</button><button data-advice-remove="'+i.id+'">取消</button></div>'}).join('')+(group.length>1?'<p class="schedule-merge">合并一单结算'+(tiers.length?'，总额越高可选的券档越高：'+esc(tiers.join(' → ')):'，优先用同一张券凑门槛')+'</p>':'')+'</div>'}).join('')+'</div>';
  html+='<div class="schedule-tools"><button data-export-ics="1">导出到手机日历（.ics）</button><small>导入后每项安排提前 15 分钟提醒</small></div>';
 }

}
function exportIcs(){const reviews=items.filter(i=>!i.done&&i.realReview?.date);if(!reviews.length){toast('还没有安排可导出');return}const pad=n=>String(n).padStart(2,'0');const stamp=d=>d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z';const escI=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//双11省钱情报局//DSH//CN','CALSCALE:GREGORIAN'];for(const i of reviews){const rv=i.realReview,d=getDecision(i,i.analysis?.recommendation)||{},start=new Date(Date.parse(rv.date+'T'+(rv.time||'20:00')+':00+08:00')),end=new Date(start.getTime()+30*60000),steps=(sameShoppingPlatform(rv.platform,d.platform)?d.claim||[]:[]).join('\n');lines.push('BEGIN:VEVENT','UID:dsh-shopping-'+i.id+'@local','DTSTAMP:'+stamp(new Date()),'DTSTART:'+stamp(start),'DTEND:'+stamp(end),'SUMMARY:'+escI('买 '+i.name+' · '+rv.platform),'DESCRIPTION:'+escI([d.offer,steps].filter(Boolean).join('\n')),'BEGIN:VALARM','TRIGGER:-PT15M','ACTION:DISPLAY','DESCRIPTION:'+escI('15 分钟后：'+i.name+' · '+rv.platform),'END:VALARM','END:VEVENT')}lines.push('END:VCALENDAR');const blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='双11购物安排-'+cnToday()+'.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出 '+reviews.length+' 项安排，用手机日历打开即可')}
const adviceStyle=document.createElement('style');adviceStyle.textContent='.schedule-group{margin-bottom:22px}.schedule-head{display:block;font-size:13px;margin-bottom:6px}.schedule-today .schedule-head{color:#c64c24}.schedule-badge{display:inline-block;font-size:10px;background:#e96535;color:#fff;border-radius:10px;padding:2px 7px;margin-right:6px;vertical-align:middle}.schedule-group .schedule-entry{margin-bottom:10px}.schedule-group .schedule-entry p{margin:4px 0}.schedule-group .schedule-entry small{font-size:11px;color:#a08670}.schedule-merge{font-size:11px;line-height:1.7;color:#355525;background:#eef5ea;border-radius:8px;padding:8px 10px;margin:6px 0 0}.schedule-tools{margin:14px 0 4px;display:flex;flex-direction:column;gap:6px}.schedule-tools button{font-size:11px;padding:7px 10px}.schedule-tools small{font-size:10px;color:#b5a18f}.step-extras{margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.step-extras a{font-size:12px;font-weight:700;color:#ee512c}.copy-code{font-size:11px;padding:4px 9px;background:#fff6ee;border:1px dashed #e8a07a;color:#b7542b;border-radius:6px}';document.head.appendChild(adviceStyle);

function storageMessage(message,failed=false){let node=document.querySelector('#shoppingStorageStatus');if(!node){node=document.createElement('p');node.id='shoppingStorageStatus';node.setAttribute('role','status');node.style.cssText='padding:10px 14px;margin-bottom:14px;border:1px solid #eadfd5;border-radius:10px;font-size:12px';document.querySelector('.headline').before(node)}node.textContent=message;node.hidden=!message;node.style.color=failed?'#bb4525':'#817260'}
async function flushShoppingStore(){if(!shoppingStoreReady||shoppingSaving||shoppingStoreError)return;shoppingSaving=true;try{while(shoppingDirty){shoppingDirty=false;const snapshot=JSON.parse(JSON.stringify(items));const response=await fetch('/api/shopping-workbench/state',{method:'POST',headers:{'Content-Type':'application/json','X-DSH-Shopping':'1'},body:JSON.stringify({items:snapshot,revision:shoppingRevision})});const data=await response.json();if(!response.ok)throw Error(data.error||'购物清单保存失败');shoppingRevision=data.revision;try{localStorage.removeItem('dsh-shopping-plan-pending-v1')}catch{}}storageMessage('')}catch(error){shoppingDirty=true;shoppingStoreError=error.message;storageMessage('清单尚未同步保存：'+error.message+'。当前内容已在本页保留，请勿关闭；可点击下方“重试保存”。',true);let retry=document.querySelector('#retryShoppingSave');if(!retry){retry=document.createElement('button');retry.id='retryShoppingSave';retry.textContent='重试保存';document.querySelector('#shoppingStorageStatus').after(retry)}retry.hidden=false;retry.onclick=()=>{shoppingStoreError='';retry.hidden=true;void flushShoppingStore()}}finally{shoppingSaving=false}}
